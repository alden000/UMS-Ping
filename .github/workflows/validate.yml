name: Validate issues
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate data and rebuild generated files
        run: python3 scripts/build.py
      - name: Generated files are committed
        run: git diff --exit-code -- data/index.json issues/
      - name: JavaScript syntax
        run: node --check assets/app.js && node --check worker/feedback-worker.js
