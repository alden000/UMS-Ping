name: Collect AI contributions
# Sunday ~21:17 SGT, ahead of the Monday 07:50 SGT curation run. Can also be run by hand.
on:
  schedule:
    - cron: "17 13 * * 0"
  workflow_dispatch:
  # Editing contributors/run-now also starts a run (lets the curator trigger a test by pushing).
  push:
    branches: [main]
    paths: [contributors/run-now]
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ask contributing AIs and submit to the Ping inbox
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PING_SUBMIT_KEY_GEMINI: ${{ secrets.PING_SUBMIT_KEY_GEMINI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PING_SUBMIT_KEY_GROQ: ${{ secrets.PING_SUBMIT_KEY_GROQ }}
        run: python3 contributors/collect.py
